<!doctype html>
<!-- Source for store/promo-marquee-1400x560.png (render at 1400x560). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>QR Reader marquee tile</title>
<style>
  html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
  body { background: linear-gradient(135deg, #4f8cff 0%, #2f5fd0 100%); color: #fff;
    font-family: system-ui, "Segoe UI", sans-serif; display: flex; align-items: center;
    padding: 0 80px; box-sizing: border-box; gap: 64px; }
  .text { flex: 0 0 520px; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 28px; }
  .brand img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  h1 { margin: 0; font-size: 60px; font-weight: 700; letter-spacing: -1px; }
  p { margin: 0 0 30px; font-size: 26px; line-height: 1.35; opacity: .95; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: step; }
  li { counter-increment: step; display: flex; align-items: center; gap: 14px; font-size: 20px; margin: 12px 0; }
  li::before { content: counter(step); flex: none; width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,.2); display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .shot { flex: 1; height: 440px; border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 20px 50px rgba(0,0,0,.35); display: flex; flex-direction: column; }
  .bar { flex: none; height: 34px; background: #e6e9ef; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #c4c9d4; }
  /* Right-hand part of the real result screenshot: QR card + decoded panel. */
  .view { flex: 1; background: url("screenshot-2-result.png") no-repeat; background-position: -622px -10px; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <img src="../icons/icon128.png" alt="">
      <h1>QR Reader</h1>
    </div>
    <p>Decode any QR code on a web page — no phone needed.</p>
    <ol>
      <li>Click the toolbar icon</li>
      <li>Draw a box around the QR code</li>
      <li>Copy the result or open the link</li>
    </ol>
  </div>
  <div class="shot">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="view"></div>
  </div>
</body>
</html>
